<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ações Práticas | O que você pode fazer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <header class="cabecalho2">
        <nav class="links3">
            <a href="index.html">📱Cartaz</a>
            <a href="sobre.html">📖 Sobre</a>
            <a href="acoes.html" class="ativo">✅ Ações</a>
        </nav>
        <div class="emoji" role="img" aria-label="Açoes práticas">✅</div>
        <h1>Ações Práticas</h1>
        <p>O que VOCÊ pode fazer para ajudar ao meio ambiente.</p>
    </header>

    <main>

        <section >
            <h2>Ações que fazem a diferença</h2>
            <div class="lista-acoes" id="container-acoes" >
            </div>
        </section>

        <section class="secao-cinza">
            <div class="container-central">
                <h2>Quero fazer parte!</h2>
                <form class="formulario" id="formulario-adesao" action="" novalidate>

                    <label for="nome">Seu nome completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: João da Silva">

                    <label for="email">Seu E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Ex: joao@email.com">
                    
                    <button type="submit" class="botao">Registrar a minha adesão</button>
                    <p class="mensagem-retorno" id="mensagem-retorno"></p>
                </form>
            </div>
        </section>
    
    </main>
    <footer>
        <p><strong>Equipe:</strong> Os Gardiões da Água</p>

        </p>
